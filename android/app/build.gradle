plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def versionFile = new File(rootProject.projectDir, "../public/android-version.json")
def versionJson = new groovy.json.JsonSlurper().parse(versionFile)

android {
    namespace "com.heartlandwiwx.streamfeeder"
    compileSdk 35
    defaultConfig {
        applicationId "com.heartlandwiwx.streamfeeder"
        minSdk 26
        targetSdk 35
        versionCode versionJson.versionCode
        versionName versionJson.versionName
        buildConfigField "String", "API_BASE", "\"https://youtube-feeder-worker.ike-j-rebout.workers.dev\""
    }
    signingConfigs {
        release {
            def store = System.getenv("ANDROID_KEYSTORE_PATH")
            if (store) {
                storeFile file(store)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2024.10.01")
    implementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.navigation:navigation-compose:2.8.3"
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "com.google.android.gms:play-services-cast-framework:21.5.0"
    implementation "androidx.mediarouter:mediarouter:1.7.0"
    implementation "com.pierfrancescosoffritti.androidyoutubeplayer:chromecast-sender:0.32"
    debugImplementation "androidx.compose.ui:ui-tooling"
}
